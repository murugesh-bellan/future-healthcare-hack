<style>
        body {
            background-color: #121212;
            color: #e5e2e1;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .orb-glow {
            filter: blur(40px);
            opacity: 0.4;
            background: radial-gradient(circle, #accdca 0%, transparent 70%);
        }

        .pulse-animation {
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.6; }
        }

        .waveform-bar {
            width: 4px;
            border-radius: 99px;
            background-color: #accdca;
            transition: height 0.1s ease;
        }

        .floating-ui {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hidden-state {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="font-body-md text-on-background">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl transition-opacity">
<div class="flex justify-between items-center px-container-margin py-4 w-full max-w-7xl mx-auto">

</button>
<h1 class="font-headline-md text-headline-md font-semibold text-primary">Daily Check-in</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A premium, soft-lit studio portrait of a calm person with warm lighting, dark background, representing a user profile for a luxury wellness app. The style is minimalist and high-end with subtle shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAAtB7OSiiKTM0hXdRt7VZoSDjSwcg3QwX5nMIbLwSG3tHcCw5cClziNDgfWb7hMZd1y1z7OicxSsADSDqv0UVpVnj3MhT0cBqpPfOZZmGHcOg0ovvzBba9NtmCeUMtGoHTqomUF3FrGZGPx8n9-IBJjjR3iXVWZUUt41PSjH2Azn1gt_wksu0PcmviId3kSHEO9wFw_6eAIeAnmIa2bKJ2IGQoN5yiEni4ev1abo5ihch0xEu3eETxIMprcm_9KGbxRROZfPYBn0KS">
</div>
</div>

<!-- Main Canvas -->

<!-- Background Ambient Glow -->

<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] orb-glow pulse-animation"></div>
</div>
<!-- Conversational Interface: Question View -->
<section class="floating-ui flex flex-col items-center gap-stack-lg text-center z-10" id="question-view">
<div class="relative w-48 h-48 flex items-center justify-center">
<!-- AI Companion Orb/Waveform Representation -->
<div class="absolute w-32 h-32 rounded-full bg-primary/20 flex items-center justify-center" id="companion-orb">
<div class="w-24 h-24 rounded-full bg-primary/40 blur-md"></div>
</div>
<!-- Animated Waveform (Hidden until listening) -->

<div class="waveform-bar h-4"></div>
<div class="waveform-bar h-8"></div>
<div class="waveform-bar h-12"></div>
<div class="waveform-bar h-6"></div>
<div class="waveform-bar h-10"></div>
</div>
</div>
<div class="space-y-stack-sm max-w-md">

                </h2>

                </p>

                        </p>

                        Back to Dashboard
                    </button>

<span class="material-symbols-outlined text-4xl" id="mic-icon" style="font-variation-settings: 'FILL' 1;">mic</span>
<!-- Ripple effect -->
<span class="absolute inset-0 rounded-full bg-primary/50 animate-ping hidden" id="mic-ping"></span>
</button>
<p class="text-on-surface-variant font-label-md tracking-wide" id="status-text">Tap to speak</p>
</div>
</main>
<!-- Bottom Navigation Bar (Suppressed on this focus screen as per UX goal, but placeholder structure is here) -->
<!-- We suppress it to prioritize the content canvas of the Daily Check-in flow -->
<script>
        let isRecording = false;
        let isSuccess = false;
        let waveformInterval;

        const micButton = document.getElementById('mic-button');
        const micIcon = document.getElementById('mic-icon');
        const micPing = document.getElementById('mic-ping');
        const statusText = document.getElementById('status-text');
        const listeningWaveform = document.getElementById('listening-waveform');
        const companionOrb = document.getElementById('companion-orb');
        const questionView = document.getElementById('question-view');
        const successView = document.getElementById('success-view');
        const actionContainer = document.getElementById('action-container');

        function toggleRecording() {
            if (isSuccess) return;

            isRecording = !isRecording;

            if (isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            micIcon.innerText = 'pause';
            micPing.classList.remove('hidden');
            statusText.innerText = 'Listening...';
            listeningWaveform.classList.remove('opacity-0');
            companionOrb.classList.add('opacity-0');
            
            // Simulate waveform animation
            const bars = document.querySelectorAll('.waveform-bar');
            waveformInterval = setInterval(() => {
                bars.forEach(bar => {
                    const randomHeight = Math.floor(Math.random() * 40) + 8;
                    bar.style.height = `${randomHeight}px`;
                });
            }, 100);

            // Simulate auto-stop and success after 3 seconds
            setTimeout(() => {
                if(isRecording) stopRecording(true);
            }, 3500);
        }

        function stopRecording(autoSuccess = false) {
            isRecording = false;
            micIcon.innerText = 'mic';
            micPing.classList.add('hidden');
            statusText.innerText = 'Processing...';
            listeningWaveform.classList.add('opacity-0');
            companionOrb.classList.remove('opacity-0');
            clearInterval(waveformInterval);

            if (autoSuccess) {
                showSuccess();
            }
        }

        function showSuccess() {
            isSuccess = true;
            
            // Transition UI
            questionView.classList.add('hidden-state');
            actionContainer.style.opacity = '0';
            actionContainer.style.transform = 'translateY(50px)';
            
            setTimeout(() => {
                successView.classList.remove('hidden-state');
                statusText.innerText = '';
            }, 400);
        }

        function resetFlow() {
            isSuccess = false;
            successView.classList.add('hidden-state');
            
            setTimeout(() => {
                questionView.classList.remove('hidden-state');
                actionContainer.style.opacity = '1';
                actionContainer.style.transform = 'translateY(0)';
                statusText.innerText = 'Tap to speak';
            }, 400);
        }

        // Ambient micro-interactions
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.orb-glow');
            const x = (e.clientX / window.innerWidth) * 20 - 10;
            const y = (e.clientY / window.innerHeight) * 20 - 10;
            glow.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        });
    </script>
